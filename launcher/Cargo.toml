[package]
name = "bundeck-launcher"
version = "1.6.0"
edition = "2021"
description = "BunDeck launcher/status window (Rust + GPUI)"
license = "MIT"

[[bin]]
name = "bundeck-launcher"
path = "src/main.rs"

[[bin]]
name = "bundeck-updater"
path = "src/updater_bin.rs"

[[bin]]
name = "bundeck-spotify-auth"
path = "src/spotify_auth_bin.rs"

[dependencies]
gpui = "0.2"
ureq = { version = "2.10", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
sha2 = "0.10"
hex = "0.4"
zip = "9"
ed25519-dalek = "2"
# HWND de la ventana GPUI (drag/maximizar nativos en la titlebar propia).
raw-window-handle = "0.6"
wry = "0.58"
tao = "0.38"

[dev-dependencies]
gpui = { version = "0.2", features = ["test-support"] }

# Tray icon nativo en Windows (Shell_NotifyIconW). El `windows` ya es
# dependencia transitiva de gpui 0.2 (misma versión: sin duplicados).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# Incrusta icon.ico en el exe (barra de tareas / Alt-Tab / marco nativo).
embed-resource = "3"

[profile.release]
opt-level = "z"
lto = true
strip = true

# xattr 0.2.3 (vía gpui -> gpui_http_client -> zed-async-tar) no compila en
# Linux con libc moderna: emite `::libc::ENOATTR` también para Linux/Android,
# donde no existe (allí es ENODATA). Vendoreado con el split por OS.
# Upstream lo corrigió en xattr 1.x, pero zed-async-tar exige 0.2.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
